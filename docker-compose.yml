version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: app_financeiro_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 4343
      POSTGRES_DB: app_financeiro
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    image: app-financeiro-api
    container_name: app_financeiro_api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - TZ=America/Sao_Paulo
      - GIN_MODE=release
      - DB_DSN=host=db user=postgres password=4343 dbname=app_financeiro port=5432 sslmode=disable TimeZone=America/Sao_Paulo
      - JWT_SECRET=Kai@1020304056
      - PORT=8080
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_EMAIL=appfinanceiro4@gmail.com
      - SMTP_PASSWORD=vsjccbcaoutuvjxo

volumes:
  pgdata: